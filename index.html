<style>
/* Layout: a street zine. Full-bleed black-and-white splash, poster headline with the three definitions
   in green, black and red, then a contact print of black film strips with edge-printed frame numbers. */
:root{
  --paper:#ffffff; --ink:#0a0a0a; --muted:#5a5a5a; --rule:#0a0a0a;
  --green:#1e7a35; --red:#c1121f; --film:#0e0e0e; --chip:#ececec; --edge:#8d8a85; --scrim:rgba(0,0,0,.97);
  --display:'Amatic SC','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Amatic SC','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* splash page: text on the left, photo filling the right half; photo on top on phones */
.splash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100svh}
.sp-photo{position:relative;overflow:hidden;background:#111}
.sp-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:56% 35%}
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,6vh,64px);text-align:center;min-width:0;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.intro h1{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,6.4vw,112px);line-height:.9;letter-spacing:.01em;white-space:nowrap}
.intro h1 b{font-weight:400;color:var(--red)}
@media (max-width:800px){
  .splash{grid-template-columns:minmax(0,1fr);grid-template-rows:52svh auto}
  .sp-photo{order:-1}
  .intro{gap:24px;padding-block:28px 36px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .intro h1{font-size:clamp(36px,14vw,110px)}
}
.defs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--body);font-weight:400;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(22px,2.2vw,32px);line-height:1.25;max-width:none}
.defs strong{font-weight:700;-webkit-text-stroke:.025em currentColor}
.defs .g{color:var(--green)} .defs .k{color:var(--ink)} .defs .r{color:var(--red)}
.defs span{color:var(--muted)}
.go{display:inline-block;font:700 28px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;background:var(--ink);padding:10px 22px 12px;border:0;cursor:pointer}
.go:hover{background:var(--red)}

/* contact sheet */
.topbar{padding-block:20px 0;border-bottom:6px solid var(--ink)}
.topbar a{display:inline-block;padding-bottom:14px;font:700 clamp(30px,3vw,40px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.topbar a b{font-weight:400;color:var(--red)}
.topbar a:hover{color:var(--red)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-block:26px 14px;font:700 clamp(24px,2.4vw,30px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.sheet-head span:last-child{color:var(--muted);font-weight:400}
/* contact print: black film strips on white paper, sprocket holes in the rebate,
   every frame the same 3:2 cell, frame numbers printed in the film edge */
.sheet{display:flex;flex-direction:column;gap:clamp(10px,1.6vw,16px);padding-bottom:48px}
.strip{--holes:#2b2b2b;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;background:var(--film);padding:22px 7px 34px}
.strip::before,.strip::after{content:"";position:absolute;left:4px;right:4px;height:7px;background:repeating-linear-gradient(90deg,transparent 0 5px,var(--holes) 5px 13px,transparent 13px 19px);border-radius:1px}
.strip::before{top:7px} .strip::after{bottom:7px}
.frame{position:relative;margin:0;min-width:0}
.frame button{all:unset;display:block;width:100%;aspect-ratio:3/2;max-width:100%;cursor:zoom-in;background:var(--film)}
.frame button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.frame img{width:100%;height:100%;object-fit:contain;transition:filter .2s}
.frame:hover img{filter:brightness(1.12)}
.frame .no{position:absolute;left:0;right:0;top:calc(100% + 4px);display:flex;justify-content:space-between;color:var(--edge);font:700 9px/1 var(--mono);letter-spacing:.12em;pointer-events:none;white-space:nowrap}

footer{border-top:6px solid var(--ink);padding-block:32px 44px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;font:400 24px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase}
.social{display:flex;justify-content:center;gap:14px}
.social a{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--chip);color:var(--ink);text-decoration:none;transition:background .2s,color .2s}
.social a:hover{background:var(--ink);color:var(--paper)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#eee;font:400 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lb-stage{display:flex;align-items:center;justify-content:center;min-height:0;padding-block:10px}
.lb-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.lb button{font:700 22px/1 var(--display);color:#fff;background:none;border:1px solid #555;padding:6px 14px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.lb button:hover{border-color:var(--red)}
.ctrls{display:flex;gap:8px;align-items:center}
#lb-count{min-width:76px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Portrait magazine cover, built with live type and the original photograph. */
.cover-page{--cover-font:'Barlow Condensed','Arial Narrow',Impact,sans-serif;display:block;width:min(100%,960px);margin:0 auto;min-height:0;background:#fff;font-family:var(--cover-font)}
body:has(.cover-page:not([hidden])){background:#ededeb}
.cover-masthead{margin:0;display:flex;align-items:center;justify-content:space-between;gap:.025em;padding:.06em .13em .1em;font:900 clamp(40px,11.2vw,108px)/1 var(--cover-font);letter-spacing:-.055em;white-space:nowrap;color:#080808}
.cover-masthead i{font-style:normal;font-weight:600;font-size:.83em;letter-spacing:-.08em}
.blood{color:#c1121f}
.cover-photo{position:relative;aspect-ratio:960/1220;isolation:isolate;overflow:hidden;background:#111;color:#fff}
.cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% center;z-index:-2}
.cover-photo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.42),transparent 55%),linear-gradient(0deg,rgba(0,0,0,.25),transparent 25%)}
.cover-copy{position:absolute;left:5.5%;top:17%;width:42%;display:flex;flex-direction:column;gap:clamp(24px,4vw,40px)}
.cover-definition h2{margin:0 0 .04em;font:900 clamp(34px,7.7vw,74px)/.95 var(--cover-font);letter-spacing:-.035em}
.cover-definition p{margin:0;font:700 clamp(15px,3.1vw,30px)/1.13 var(--cover-font);letter-spacing:-.025em}
.cover-definition:not(:last-child)::after{content:"";display:block;width:16%;height:3px;margin-top:clamp(18px,3.2vw,32px);background:#fff}
.cover-enter{position:absolute;left:5.5%;bottom:4%;font:800 clamp(28px,5.5vw,52px)/1 var(--cover-font);letter-spacing:-.03em;text-decoration:none}
.cover-enter:hover{color:#c1121f}
.cover-enter:focus-visible{outline-color:#fff}
@media(min-width:1100px){.cover-page{width:min(760px,100%)}.cover-masthead{font-size:85px}.cover-definition h2{font-size:60px}.cover-definition p{font-size:24px}.cover-copy{gap:28px}.cover-definition:not(:last-child)::after{margin-top:24px}.cover-enter{font-size:42px}}
@media(max-width:420px){.cover-copy{width:46%;top:16%;gap:18px}.cover-definition h2{font-size:34px}.cover-definition p{font-size:15px}.cover-definition:not(:last-child)::after{margin-top:16px}}

/* Landscape splash: full-width masthead, copy beside the original photo. */
.cover-page{width:100%;max-width:none;min-height:100svh;display:flex;flex-direction:column}
.cover-masthead{justify-content:center;gap:.13em;padding:.12em .2em;font-size:clamp(40px,8.2vw,140px);letter-spacing:-.04em}
.cover-photo{aspect-ratio:auto;flex:1;min-height:650px;background:#0a0a0a;overflow:hidden}
.cover-image{left:38%;width:62%;object-position:center;object-fit:cover}
.cover-photo::after{background:linear-gradient(90deg,#0a0a0a 0%,#0a0a0a 34%,rgba(10,10,10,.65) 40%,transparent 52%)}
.cover-copy{position:relative;left:auto;top:auto;width:38%;padding:48px 4vw 110px;gap:28px}
.cover-definition h2{font-size:clamp(40px,4vw,64px)}
.cover-definition p{font-size:clamp(19px,1.8vw,28px);letter-spacing:0}
.cover-definition:not(:last-child)::after{margin-top:24px}
.cover-enter{left:4vw;bottom:30px;font-size:40px}
@media(max-width:700px){
 .cover-masthead{font-size:clamp(35px,8vw,58px);gap:.08em}
 .cover-photo{min-height:0;display:flex;flex-direction:column}
 .cover-image{position:relative;inset:auto;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;order:0}
 .cover-photo::after{display:none}
 .cover-copy{order:1;width:100%;padding:28px 24px;gap:24px}
 .cover-definition h2{font-size:38px}
 .cover-definition p{font-size:22px}
 .cover-definition:not(:last-child)::after{margin-top:20px}
 .cover-enter{position:relative;left:auto;bottom:auto;order:2;margin:0 24px 32px;font-size:34px}
}

/* Restore the original Amatic SC lettering throughout the splash. */
.cover-page{--cover-font:'Amatic SC','Arial Narrow','Helvetica Neue',Arial,sans-serif}
.cover-masthead{font-weight:700;letter-spacing:.01em}
.cover-definition h2{font-weight:700;letter-spacing:.01em}
.cover-definition p{font-weight:400;letter-spacing:.03em}
.cover-enter{font-weight:700;letter-spacing:.06em}

/* Full-screen photographic entry, with quiet Amatic lettering. */
.immersive{display:block;position:relative;isolation:isolate;min-height:100svh;width:100%;overflow:hidden;background:#111;color:#fff;font-family:'Amatic SC','Arial Narrow',sans-serif}
.immersive-photo{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:55% 50%}
.immersive::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(0,0,0,.16) 43%,transparent 65%),linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%)}
.immersive-header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:30px 3.5vw}
.immersive-header h1{margin:0;font-size:clamp(26px,2.8vw,44px);font-weight:700;line-height:1.1;letter-spacing:.04em;white-space:nowrap}
.immersive-header h1 span{padding:0 .1em;font-weight:400}
.immersive-header em{font-style:normal;color:#c1121f}
.immersive-header nav{display:flex;gap:18px;font-size:clamp(20px,1.8vw,28px);align-items:center}
.immersive a{text-decoration:none}
.immersive a:hover{color:#e34b55}
.immersive-copy{width:min(45%,660px);padding:0 0 70px;margin:clamp(100px,24vh,280px) 0 0 4vw}
.immersive-copy p{margin:0 0 30px;font-size:clamp(22px,2.1vw,34px);font-weight:400;line-height:1.35;letter-spacing:.025em}
.immersive-copy strong{font-weight:700}
.immersive-enter{display:inline-block;margin-top:10px;font-size:clamp(36px,3.2vw,52px);font-weight:700;line-height:1.2;padding:6px 0}
@media(max-width:700px){
 .immersive-header{padding:24px 20px;align-items:flex-start;gap:16px}
 .immersive-header h1{font-size:28px}
 .immersive-header nav{font-size:20px;gap:10px;flex-wrap:wrap;justify-content:flex-end}
 .immersive-photo{object-position:58% center}
 .immersive::before{background:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.2) 80%),linear-gradient(0deg,rgba(0,0,0,.4),transparent)}
 .immersive-copy{width:calc(100% - 40px);max-width:410px;margin:clamp(150px,32vh,300px) 20px 0;padding-bottom:40px}
 .immersive-copy p{font-size:25px;margin-bottom:24px;max-width:330px}
 .immersive-enter{font-size:38px}
}
@media(prefers-reduced-motion:reduce){.immersive{scroll-behavior:auto}}

/* Title scale and monochrome social controls. */
.immersive-header h1{font-size:clamp(32.5px,3.5vw,55px)}
.immersive-copy .blood{color:#c1121f}
.immersive-header nav{gap:10px;flex-shrink:0}
.immersive-header nav a{display:grid;place-items:center;width:44px;height:44px;color:#fff;transition:color .2s}
.immersive-header nav a:hover,.immersive-header nav a:focus-visible{color:#c1121f}
.immersive-header nav svg{display:block;width:26px;height:26px}
@media(max-width:700px){.immersive-header h1{font-size:35px}.immersive-header nav{gap:2px}.immersive-header nav a{width:36px;height:40px}.immersive-header nav svg{width:24px;height:24px}}
@media(max-width:380px){.immersive-header{gap:8px;padding-inline:16px}.immersive-header nav a{width:30px}}

/* A second 25% title increase and large, slender hand-drawn social marks. */
.immersive-header h1{font-size:clamp(40.625px,4.375vw,68.75px)}
.immersive-header nav{gap:16px}
.immersive-header nav a{width:64px;height:64px}
.immersive-header nav svg{width:52px;height:52px;stroke-width:1.05}
.immersive-header .social-slash{font:400 64px/1 'Amatic SC','Arial Narrow',sans-serif;color:#fff}
@media(max-width:700px){
 .immersive-header{flex-wrap:wrap}
 .immersive-header h1{font-size:43.75px}
 .immersive-header nav{gap:12px}
 .immersive-header nav a{width:60px;height:60px}
 .immersive-header nav svg{width:48px;height:48px}
 .immersive-header .social-slash{font-size:60px}
}

/* Smaller sketch-style social marks; retain generous click targets. */
.immersive-header nav svg{width:41.6px;height:41.6px;stroke-width:1.05}
@media(max-width:700px){.immersive-header nav svg{width:38.4px;height:38.4px}}
</style>

function step(d){idx=(idx+d+PHOTOS.length)%PHOTOS.length; show();}
